<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>
  h1 { position: absolute; left: 0; right: 0; top: 104px; margin: 0; text-align: center; font: 500 50px/1 var(--serif); letter-spacing: -.01em; }
  .card { position: absolute; top: 300px; width: 250px; height: 164px; background: #fff; border: 1.5px solid var(--rule); border-radius: 16px; padding: 24px 24px; box-shadow: 0 10px 28px rgba(0,0,0,.05); }
  .card .d { margin-top: 22px; font: 400 22px/1.3 var(--sans); color: var(--ink-80); }
  .br { position: absolute; top: 240px; height: 40px; }
  .br .line { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; border: 2px solid var(--ink-40); border-bottom: none; border-radius: 6px 6px 0 0; transform-origin: 50% 100%; }
  .br .lab { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 500 16px/1 var(--sans); color: var(--ink-60); letter-spacing: .01em; }
  #br1 .line { border-color: var(--silent-line); } #br1 .lab { color: var(--silent); }
  #br2 .line { border-color: var(--ask-line); } #br2 .lab { color: var(--ask-ink, #8f5600); }
  .bottom { position: absolute; left: 0; right: 0; top: 516px; text-align: center; font: 400 34px/1.2 var(--serif); }
</style></head>
<body>
<div id="bar" class="barwrap"></div>
<h1 id="h">Who decides?</h1>
<div class="br" id="br1" style="left:104px; width:524px"><div class="lab">the agent decides</div><div class="line"></div></div>
<div class="br" id="br2" style="left:652px; width:250px"><div class="lab">a human signs off</div><div class="line"></div></div>
<div class="card" id="k1" style="left:104px"><span id="b1"></span><div class="d">orders</div></div>
<div class="card" id="k2" style="left:378px"><span id="b2"></span><div class="d">orders, tells the human</div></div>
<div class="card" id="k3" style="left:652px"><span id="b3"></span><div class="d">waits for a human</div></div>
<div class="card" id="k4" style="left:926px"><span id="b4"></span><div class="d">refused, with the rule</div></div>
<div class="bottom" id="bot"><span class="hl" id="hlb">Plain code. No language model approves an order.</span></div>
<script>
setup(6);
const st = parseInt(Q.get('bar') ?? '4');
$('bar').innerHTML = chapterBar(st);
if (Q.get('bar') === 'none') $('bar').style.display = 'none';
$('b1').innerHTML = tierBadge('silent', 'Auto');
$('b2').innerHTML = tierBadge('notify', 'Auto + FYI');
$('b3').innerHTML = tierBadge('ask', 'Needs approval');
$('b4').innerHTML = tierBadge('block', 'Refused');
window.render = function (t) {
  fadeUp($('h'), p(t, 0.05, 0.6), 12);
  ['k1', 'k2', 'k3', 'k4'].forEach((id, i) => fadeUp($(id), p(t, 0.5 + i * 0.42, 0.6), 22));
  [['br1', 2.3], ['br2', 2.65]].forEach(([id, s]) => {
    const a = p(t, s, 0.55);
    const el = $(id);
    el.querySelector('.lab').style.opacity = a;
    el.querySelector('.line').style.opacity = a;
    el.querySelector('.line').style.transform = `scaleX(${(0.6 + 0.4 * a).toFixed(3)})`;
  });
  fadeUp($('bot'), p(t, 3.2, 0.6), 10);
  hl($('hlb'), easeInOut(lin(t, 3.75, 0.85)));
};
render(0);
</script>
</body></html>
