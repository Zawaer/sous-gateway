<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title>Approve order · Sous</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; }
    main { padding: var(--space); padding-bottom: 0; }
    h1 { font: 500 2.2rem/1.1 var(--serif); margin: 8px 0 6px; }
    .reason { font-size: 1.05rem; line-height: 1.45; margin: 10px 0; }
    .rule-id { font: .75rem var(--mono); color: var(--ink-60); }
    .when { color: var(--ask-ink); font-weight: 500; }
    .when.late { color: var(--block-ink); }
    table.lines { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: .92rem; }
    table.lines td { padding: 8px 0; border-top: 1px solid var(--rule); vertical-align: top; }
    table.lines td.num { text-align: right; white-space: nowrap; padding-left: 12px; }
    label { display: block; font-weight: 500; margin: 14px 0 6px; }
    input[type=text], input[type=password] { width: 100%; min-height: var(--tap); padding: 0 12px; box-sizing: border-box;
      border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
    .hint { color: var(--ink-60); font-size: .88rem; margin: 6px 0 0; }
    .msg { margin: 12px 0; padding: 12px 14px; border-radius: var(--radius); background: var(--panel-strong); }
    .msg.err { box-shadow: inset 3px 0 0 var(--block-ink); }
    .msg.ok { box-shadow: inset 3px 0 0 var(--silent); }
    .btn { min-height: var(--tap); border: 0; border-radius: var(--radius); padding: 0 16px; cursor: pointer; font-weight: 500; }
    .actionbar { margin: 18px calc(-1 * var(--space)) 0; }
    details { margin: 18px 0; color: var(--ink-60); font-size: .88rem; }
    details pre { white-space: pre-wrap; word-break: break-all; font: .75rem var(--mono); }
  </style>
</head>
<body>
<main id="main" aria-live="polite"><p class="muted">Loading the order…</p></main>
<script>
"use strict";
// Passkey approval of one held order. Opened from an order link: approve.html?order=PO-…&sandbox=SBX-…
// The passkey signs a challenge that is the hash of this exact order (id, quote, total, lines, approve_by),
// so the approval proves who approved what. API: docs/PROTOCOL.md section 26.
const P = new URLSearchParams(location.search);
const ORDER = (P.get("order") || "").trim();
const SANDBOX = (P.get("sandbox") || "").trim().toUpperCase();
const API = P.get("api") || "";
const CODE_KEY = "vk-approver-code" + (SANDBOX ? ":" + SANDBOX : "");  // same key as the seller UI (app.js)
const ls = {
  get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const $ = (s) => document.querySelector(s);
const main = $("#main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" }).format(n ?? 0);
const UNITS = { ST: "pcs", KG: "kg", L: "l", PAK: "pack", KAR: "box", LTK: "crate" };
const sentence = (s) => { s = String(s || ""); return s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s; };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const when = (iso) => { const d = new Date(iso); return `${DAYS[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}. ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

// WebAuthn JSON <-> ArrayBuffer (base64url), so this works in browsers without parseCreationOptionsFromJSON.
const b2a = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const b = atob(s + "=".repeat((4 - s.length % 4) % 4)); return Uint8Array.from(b, (c) => c.charCodeAt(0)).buffer; };
const a2b = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  const code = ls.get(CODE_KEY);
  if (code) headers["X-Approver-Code"] = code;
  const r = await fetch(API + path, { ...opts, headers });
  let body = {};
  try { body = await r.json(); } catch { /* empty */ }
  if (!r.ok) { const e = new Error(body.message || `The gateway answered ${r.status}.`); e.status = r.status; e.code = body.error; throw e; }
  return body;
}

let order = null, keys = null, tick = null;

function say(html, kind = "") {
  const m = $("#msg");
  if (m) { m.className = "msg " + kind; m.innerHTML = html; m.hidden = false; }
}

function askCode(why) {
  main.innerHTML = `
    <h1>Approve an order</h1>
    <p>${esc(why)}</p>
    <form id="codef">
      <label for="code">Approver code${SANDBOX ? ` for sandbox ${esc(SANDBOX)}` : ""}</label>
      <input id="code" type="password" autocomplete="off" required>
      <p class="hint">${SANDBOX ? "The sandbox's approver token (sbxa_…) from its quickstart." : "The code your gateway operator gave you."} It stays in this browser.</p>
      <div class="actionbar"><button class="btn yes" type="submit">Continue</button></div>
    </form>`;
  $("#codef").onsubmit = (e) => { e.preventDefault(); ls.set(CODE_KEY, $("#code").value.trim()); load(); };
}

async function load() {
  if (!ORDER) { main.innerHTML = `<h1>No order</h1><p>Open this page from an approval link (it ends in <span class="mono">?order=PO-…</span>).</p>`; return; }
  try {
    order = await api(`/orders/${encodeURIComponent(ORDER)}`);
    keys = await api(`/orders/${encodeURIComponent(ORDER)}/passkeys`);
  } catch (e) {
    if (e.status === 401 || e.status === 404) return askCode(`Order ${ORDER} is private, or doesn't exist. Enter your approver code to see it.`);
    main.innerHTML = `<h1>Can't load the order</h1><p>${esc(e.message)}</p><p><button class="btn no" onclick="load()">Try again</button></p>`;
    return;
  }
  render();
}

function reasons(o) {
  const f = ((o.decision || {}).findings || []).filter((x) => x.outcome === "ask" || x.outcome === "block");
  return f.length ? f : ((o.decision || {}).findings || []);
}

function render() {
  const o = order, pending = o.status === "pending_approval";
  const rs = reasons(o);
  const has = keys.passkeys.length > 0;
  const lines = (o.lines || []).map((l) => `<tr><td>${esc(sentence(l.name))}<div class="rule-id">${esc(l.product_id)}</div></td>
      <td class="num">${esc(l.quantity)} ${esc(UNITS[l.sales_unit] || l.sales_unit || "")}</td>
      <td class="num">${eur(l.line_total_ex_vat)}</td></tr>`).join("");
  main.innerHTML = `
    <p class="muted small">${esc(o.buyer)} · order <span class="mono">${esc(o.id)}</span></p>
    <h1>${eur(o.total_ex_vat)} <span class="muted small">ex VAT</span></h1>
    ${pending ? `<span class="tier tier-ask">Needs approval</span>` : `<p><strong>${esc(statusText(o))}</strong></p>`}
    ${rs.map((f) => `<p class="reason">${esc(f.message)}<br><span class="rule-id">${esc(f.rule)}</span></p>`).join("")}
    ${pending && o.approve_by ? `<p id="deadline" class="when"></p>` : ""}
    <div id="msg" class="msg" hidden></div>
    ${pending ? actions(has) : ""}
    <table class="lines" aria-label="Order lines">${lines}</table>
    <p class="hint">Delivery ${esc(o.delivery_date || "")}. Checked by the mandate rules; no AI in this step.</p>
    ${has ? `<p class="hint">Passkeys for this order: ${keys.passkeys.map((k) => `${esc(k.approver)} (…${esc(k.last8)})`).join(", ")}.</p>` : ""}
    <details><summary>What the passkey signs</summary>
      <p>A challenge that is the SHA-256 hash of this order's id, its signed quote, total, lines and approve-by time.
      Anyone can re-check it later: <a href="${API}/orders/${encodeURIComponent(o.id)}/approval/verify">verify this approval</a>.</p>
      <pre id="binding">Shown when you approve.</pre></details>`;
  if (pending && o.approve_by) countdown(o.approve_by);
  wire(has);
}

function statusText(o) {
  const a = o.approval || {};
  return { ordered: `Approved${a.by ? " by " + a.by : ""}. Ordered.`, rejected: `Rejected${a.by ? " by " + a.by : ""}.`,
           refused: "Refused. " + (a.result_reason || ""), expired: "Approved too late. " + (a.result_reason || ""),
           expired_cutoff: "Nobody approved in time; nothing was ordered." }[o.status] || o.status;
}

function actions(has) {
  if (!has) return `
    <form id="regf">
      <p>No passkey is set up for ${esc(order.buyer)} yet. Set one up on this phone once; after that you approve with your face, fingerprint or PIN.</p>
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" required value="${esc(ls.get("vk-approver"))}">
      <p class="hint">Shown on every order you approve. Setting up needs the approver code${SANDBOX ? " (sandbox token)" : ""}.</p>
      <div class="actionbar actionbar-buttons"><button id="nocode" class="btn no" type="button">Reject</button>
        <button class="btn yes" type="submit">Set up a passkey</button></div>
    </form>`;
  return `<div class="actionbar actionbar-buttons">
      <button id="no" class="btn no" type="button">Reject</button>
      <button id="yes" class="btn yes" type="button">Approve ${eur(order.total_ex_vat)} with passkey</button></div>`;
}

function countdown(at) {
  clearInterval(tick);
  const draw = () => {
    const el = $("#deadline"); if (!el) return clearInterval(tick);
    const ms = new Date(at) - Date.now();
    if (ms <= 0) { el.textContent = `The deadline ${when(at)} has passed.`; el.classList.add("late"); return clearInterval(tick); }
    const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4);
    el.textContent = `Decide by ${when(at)} (${h ? h + " h " : ""}${m} min left), or this delivery is lost.`;
  };
  draw(); tick = setInterval(draw, 30000);
}

function wire(has) {
  if (!window.PublicKeyCredential) say("This browser can't use passkeys. Open the link in Safari, Chrome or Edge on your phone.", "err");
  const reg = $("#regf");
  if (reg) reg.onsubmit = (e) => { e.preventDefault(); register($("#name").value.trim(), reg.querySelector("button")); };
  if ($("#nocode")) $("#nocode").onclick = () => rejectWithCode($("#nocode"));
  if ($("#yes")) $("#yes").onclick = () => decide("approve", $("#yes"));
  if ($("#no")) $("#no").onclick = () => decide("reject", $("#no"));
}

async function register(name, btn) {
  if (!name) return say("Enter your name first.", "err");
  ls.set("vk-approver", name);
  btn.disabled = true;
  try {
    const opts = await api("/approvers/register/options", { method: "POST", body: JSON.stringify({ name, mandate_id: order.mandate_id }) });
    const pk = opts.publicKey;
    const cred = await navigator.credentials.create({ publicKey: {
      ...pk, challenge: b2a(pk.challenge), user: { ...pk.user, id: b2a(pk.user.id) },
      excludeCredentials: (pk.excludeCredentials || []).map((c) => ({ ...c, id: b2a(c.id) })) } });
    await api("/approvers/register/verify", { method: "POST", body: JSON.stringify({ credential: {
      id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: { clientDataJSON: a2b(cred.response.clientDataJSON), attestationObject: a2b(cred.response.attestationObject),
                  transports: cred.response.getTransports ? cred.response.getTransports() : [] } } }) });
    keys = await api(`/orders/${encodeURIComponent(ORDER)}/passkeys`);
    render();
    say("Passkey set up. You can approve now.", "ok");
  } catch (e) {
    btn.disabled = false;
    if (e.status === 401) return askCode("Setting up a passkey needs the approver code once.");
    say(esc(e.name === "NotAllowedError" ? "Passkey setup was cancelled. Try again when you're ready." : e.message), "err");
  }
}

async function rejectWithCode(btn) {
  const by = ($("#name").value || "").trim();
  if (!by) return say("Enter your name first: it is recorded with the rejection.", "err");
  if (!confirm(`Reject order ${order.id} for ${eur(order.total_ex_vat)}? Nothing will be ordered.`)) return;
  btn.disabled = true;
  try {
    order = await api(`/orders/${encodeURIComponent(ORDER)}/reject`, { method: "POST", body: JSON.stringify({ by }) });
    render();
    say(esc(statusText(order)), "ok");
  } catch (e) {
    btn.disabled = false;
    if (e.status === 401) return askCode("Rejecting without a passkey needs the approver code.");
    say(esc(e.message), "err");
  }
}

async function decide(action, btn) {
  if (action === "reject" && !confirm(`Reject order ${order.id} for ${eur(order.total_ex_vat)}? Nothing will be ordered.`)) return;
  document.querySelectorAll(".actionbar button").forEach((b) => (b.disabled = true));
  try {
    const opts = await api(`/orders/${encodeURIComponent(ORDER)}/approve/options`, { method: "POST", body: JSON.stringify({ action }) });
    $("#binding").textContent = JSON.stringify(opts.binding, null, 2);
    const pk = opts.publicKey;
    const a = await navigator.credentials.get({ publicKey: {
      ...pk, challenge: b2a(pk.challenge), allowCredentials: (pk.allowCredentials || []).map((c) => ({ ...c, id: b2a(c.id) })) } });
    order = await api(`/orders/${encodeURIComponent(ORDER)}/${action}/passkey`, { method: "POST", body: JSON.stringify({ credential: {
      id: a.id, rawId: a2b(a.rawId), type: a.type,
      response: { clientDataJSON: a2b(a.response.clientDataJSON), authenticatorData: a2b(a.response.authenticatorData),
                  signature: a2b(a.response.signature), userHandle: a.response.userHandle ? a2b(a.response.userHandle) : null } } }) });
    render();
    say(`Signed with ${esc((order.approval || {}).authority || "a passkey")}, over this exact order. <a href="${API}/orders/${encodeURIComponent(order.id)}/approval/verify">Verify</a>`,
        order.status === "ordered" || order.status === "rejected" ? "ok" : "err");
  } catch (e) {
    document.querySelectorAll(".actionbar button").forEach((b) => (b.disabled = false));
    say(esc(e.name === "NotAllowedError" ? "The passkey prompt was cancelled. Nothing was decided." : e.message), "err");
  }
}

load();
</script>
</body>
</html>
