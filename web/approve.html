<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title data-i18n="approve.title">Approve order · Sous</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <style>
    body { max-width: 560px; margin: 0 auto; }
    /* style.css draws tier icons with an icon font this page doesn't load (no CDN): use tokens.css's glyph */
    .tier-ask::before { content: "\2016"; font: 700 .95em/1 var(--sans); font-variation-settings: normal; }
    .top-in { padding: 4px var(--space); justify-content: space-between; }
    main { padding: var(--space); padding-bottom: 0; }
    h1 { font: 500 2.2rem/1.1 var(--serif); margin: 8px 0 6px; }
    .reason { font-size: 1.05rem; line-height: 1.45; margin: 10px 0; }
    .rule-id { font: .75rem var(--mono); color: var(--ink-60); }
    .when { color: var(--ask-ink); font-weight: 500; }
    .when.late { color: var(--block-ink); }
    table.lines { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: .92rem; }
    table.lines td { padding: 8px 0; border-top: 1px solid var(--rule); vertical-align: top; }
    table.lines td.num { text-align: right; white-space: nowrap; padding-left: 12px; }
    label { display: block; font-weight: 500; margin: 14px 0 6px; }
    input[type=text], input[type=password] { width: 100%; min-height: var(--tap); padding: 0 12px; box-sizing: border-box;
      border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
    .hint { color: var(--ink-60); font-size: .88rem; margin: 6px 0 0; }
    .msg { margin: 12px 0; padding: 12px 14px; border-radius: var(--radius); background: var(--panel-strong); }
    .msg.err { box-shadow: inset 3px 0 0 var(--block-ink); }
    .msg.ok { box-shadow: inset 3px 0 0 var(--silent); }
    .btn { min-height: var(--tap); border: 0; border-radius: var(--radius); padding: 0 16px; cursor: pointer; font-weight: 500; }
    .actionbar { margin: 18px calc(-1 * var(--space)) 0; }
    details { margin: 18px 0; color: var(--ink-60); font-size: .88rem; }
    details pre { white-space: pre-wrap; word-break: break-all; font: .75rem var(--mono); }
  </style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand"><svg class="logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h4l5 11 5-11h4l-7.5 16h-3z" fill="currentColor"/></svg>
      <span class="name">Sous</span></span>
    <span data-i18n-toggle></span>
  </div>
</header>
<main id="main" aria-live="polite"><p class="muted" data-i18n="approve.loading">Loading the order…</p></main>
<script>
"use strict";
// Passkey approval of one held order. Opened from an order link: approve.html?order=PO-…&sandbox=SBX-…
// The passkey signs a challenge that is the hash of this exact order (id, quote, total, lines, approve_by),
// so the approval proves who approved what. API: docs/PROTOCOL.md section 26.
const P = new URLSearchParams(location.search);
const ORDER = (P.get("order") || "").trim();
const SANDBOX = (P.get("sandbox") || "").trim().toUpperCase();
const API = P.get("api") || "";
const CODE_KEY = "vk-approver-code" + (SANDBOX ? ":" + SANDBOX : "");  // same key as the seller UI (app.js)
const ls = {
  get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const $ = (s) => document.querySelector(s);
const main = $("#main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = I18N.t;
const eur = (n) => I18N.money(n ?? 0);
const sentence = (s) => { s = String(s || ""); return s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s; };
const when = (iso) => I18N.dayTime(iso);

// WebAuthn JSON <-> ArrayBuffer (base64url), so this works in browsers without parseCreationOptionsFromJSON.
const b2a = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const b = atob(s + "=".repeat((4 - s.length % 4) % 4)); return Uint8Array.from(b, (c) => c.charCodeAt(0)).buffer; };
const a2b = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  const code = ls.get(CODE_KEY);
  if (code) headers["X-Approver-Code"] = code;
  const r = await fetch(API + path, { ...opts, headers });
  let body = {};
  try { body = await r.json(); } catch { /* empty */ }
  if (!r.ok) { const e = new Error(body.message || t("approve.http_error", { status: r.status })); e.status = r.status; e.code = body.error; throw e; }
  return body;
}

let order = null, keys = null, tick = null, binding = "";
let view = null;  // redraws the current screen after a language change

function say(html, kind = "") {
  const m = $("#msg");
  if (m) { m.className = "msg " + kind; m.innerHTML = html; m.hidden = false; }
}

function askCode(key, vars) {
  view = () => askCode(key, vars);
  main.innerHTML = `
    <h1>${esc(t("approve.ask_h1"))}</h1>
    <p>${esc(t(key, vars))}</p>
    <form id="codef">
      <label for="code">${esc(SANDBOX ? t("approve.code_label_sbx", { sbx: SANDBOX }) : t("approve.code_label"))}</label>
      <input id="code" type="password" autocomplete="off" required>
      <p class="hint">${esc(t(SANDBOX ? "approve.code_hint_sbx" : "approve.code_hint"))}</p>
      <div class="actionbar"><button class="btn yes" type="submit">${esc(t("approve.continue"))}</button></div>
    </form>`;
  $("#codef").onsubmit = (e) => { e.preventDefault(); ls.set(CODE_KEY, $("#code").value.trim()); load(); };
}

async function load() {
  if (!ORDER) { view = load; main.innerHTML = `<h1>${esc(t("approve.no_order_h1"))}</h1><p>${t("approve.no_order_html")}</p>`; return; }
  try {
    order = await api(`/orders/${encodeURIComponent(ORDER)}`);
    keys = await api(`/orders/${encodeURIComponent(ORDER)}/passkeys`);
  } catch (e) {
    if (e.status === 401 || e.status === 404) return askCode("approve.private", { id: ORDER });
    view = () => { main.innerHTML = `<h1>${esc(t("approve.cant_load"))}</h1><p>${esc(e.message)}</p><p><button class="btn no" onclick="load()">${esc(t("common.try_again"))}</button></p>`; };
    view();
    return;
  }
  render();
}

function reasons(o) {
  // each finding keeps its index: explanations_fi.findings is keyed by it
  const all = ((o.decision || {}).findings || []).map((x, i) => ({ ...x, i }));
  const f = all.filter((x) => x.outcome === "ask" || x.outcome === "block");
  return f.length ? f : all;
}

// The gateway's own sentence in the page language: Finnish from the unsigned explanations_fi when there is one.
const fiText = (o) => (I18N.lang === "fi" && o.explanations_fi) || {};
const findingText = (o, f) => (fiText(o).findings || {})[String(f.i)] || f.message;

function render() {
  view = render;
  const o = order, pending = o.status === "pending_approval";
  const rs = reasons(o);
  const has = keys.passkeys.length > 0;
  // "What the passkey signs" only where a passkey is (or was) the path: pending with a passkey set up, or decided
  // with one. Not after an approver-code decision, nor while no passkey exists for this order.
  const byPasskey = /^passkey/.test((o.approval || {}).authority || "");
  const showSigns = pending ? has : byPasskey;
  const lines = (o.lines || []).map((l) => `<tr><td>${esc(sentence(l.name))}<div class="rule-id">${esc(l.product_id)}</div></td>
      <td class="num">${esc(I18N.num(l.quantity))} ${esc(I18N.unit(l.sales_unit))}</td>
      <td class="num">${eur(l.line_total_ex_vat)}</td></tr>`).join("");
  main.innerHTML = `
    <p class="muted small">${esc(o.buyer)} · ${esc(t("approve.order"))} <span class="mono">${esc(o.id)}</span></p>
    <h1>${eur(o.total_ex_vat)} <span class="muted small">${esc(t("common.ex_vat"))}</span></h1>
    ${pending ? `<span class="tier tier-ask">${esc(I18N.tier("ask"))}</span>` : `<p><strong>${esc(statusText(o))}</strong></p>`}
    ${rs.map((f) => `<p class="reason">${esc(findingText(o, f))}<br><span class="rule-id">${esc(f.rule)}</span></p>`).join("")}
    ${pending && o.approve_by ? `<p id="deadline" class="when"></p>` : ""}
    <div id="msg" class="msg" hidden></div>
    ${pending ? actions(has) : ""}
    <table class="lines" aria-label="${esc(t("approve.lines_label"))}">${lines}</table>
    <p class="hint">${esc(t("approve.delivery", { date: o.delivery_date ? I18N.date(o.delivery_date, { weekday: true }) : "" }))}</p>
    ${has ? `<p class="hint">${esc(t("approve.passkeys_for", { list: keys.passkeys.map((k) => `${k.approver} (…${k.last8})`).join(", ") }))}</p>` : ""}
    ${showSigns ? `<details><summary>${esc(t("approve.signs_summary"))}</summary>
      <p>${esc(t("approve.signs_text"))} <a href="${API}/orders/${encodeURIComponent(o.id)}/approval/verify">${esc(t("approve.verify_link"))}</a>.</p>
      <pre id="binding">${esc(binding || t("approve.binding_placeholder"))}</pre></details>` : ""}`;
  if (pending && o.approve_by) countdown(o.approve_by, (o.approve_by_detail || {}).basis);
  wire(has);
}

function statusText(o) {
  const a = o.approval || {};
  const why = fiText(o).result_reason || a.result_reason;  // the gateway's own sentence, Finnish when available
  const reason = why ? " " + why : "";
  return { ordered: a.by ? t("approve.st_ordered_by", { by: a.by }) : t("approve.st_ordered"),
           rejected: a.by ? t("approve.st_rejected_by", { by: a.by }) : t("approve.st_rejected"),
           refused: t("approve.st_refused") + reason, expired: t("approve.st_expired") + reason,
           expired_cutoff: t("approve.st_expired_cutoff") }[o.status] || o.status;
}

function actions(has) {
  // Passkey first whenever one is set up or the mandate requires it; the approver code is the fallback,
  // hidden when the mandate requires a passkey (the gateway refuses code approval there: passkey_required).
  const requirePk = keys.approval_method === "passkey";
  const amount = eur(order.total_ex_vat);
  const name = `<label for="name">${esc(t("approve.your_name"))}</label>
      <input id="name" type="text" autocomplete="name" required value="${esc(ls.get("vk-approver"))}">`;
  const code = `<label for="code">${esc(SANDBOX ? t("approve.code_label_sbx", { sbx: SANDBOX }) : t("approve.code_label"))}</label>
      <input id="code" type="password" autocomplete="off" value="${esc(ls.get(CODE_KEY))}">
      <p class="hint">${esc(t(SANDBOX ? "approve.code_hint_sbx" : "approve.code_hint"))}</p>`;
  if (has) return `<div class="actionbar actionbar-buttons">
      <button id="no" class="btn no" type="button">${esc(t("approve.reject"))}</button>
      <button id="yes" class="btn yes" type="button">${esc(t("approve.approve_btn", { amount }))}</button></div>
    ${requirePk ? `<p class="hint">${esc(t("approve.only_passkey"))}</p>` : `
    <details id="codebox"><summary>${esc(t("approve.code_instead"))}</summary>
      ${name}${code}
      <p><button id="yescode" class="btn no tap" type="button">${esc(t("approve.approve_code_btn", { amount }))}</button></p></details>`}`;
  if (requirePk) return `
    <form id="regf">
      <p>${esc(t("approve.no_passkey_required", { buyer: order.buyer }))}</p>
      ${name}
      <p class="hint">${esc(t(SANDBOX ? "approve.name_hint_sbx" : "approve.name_hint"))}</p>
      <div class="actionbar actionbar-buttons"><button id="nocode" class="btn no" type="button">${esc(t("approve.reject"))}</button>
        <button class="btn yes" type="submit">${esc(t("approve.setup"))}</button></div>
    </form>`;
  return `
    <form id="codef2">
      ${name}${code}
      <div class="actionbar actionbar-buttons"><button id="nocode" class="btn no" type="button">${esc(t("approve.reject"))}</button>
        <button id="yescode" class="btn yes" type="submit">${esc(t("approve.approve_plain", { amount }))}</button></div>
    </form>
    <details id="regbox"><summary>${esc(t("approve.setup_instead"))}</summary>
      <p>${esc(t("approve.setup_instead_text"))}</p>
      <p><button id="regbtn" class="btn no tap" type="button">${esc(t("approve.setup"))}</button></p></details>`;
}

function countdown(at, basis) {
  // approve_by set by the mandate's or sandbox's end, not Valio's cut-off (sous/deadline.py)
  const key = { mandate_expires: "approve.decide_by_mandate", sandbox_expires: "approve.decide_by_sandbox" }[basis]
    || "approve.decide_by";
  clearInterval(tick);
  const draw = () => {
    const el = $("#deadline"); if (!el) return clearInterval(tick);
    const ms = new Date(at) - Date.now();
    if (ms <= 0) { el.textContent = t("approve.deadline_passed", { when: when(at) }); el.classList.add("late"); return clearInterval(tick); }
    const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4);
    el.textContent = t(key, { when: when(at), left: `${h ? h + " h " : ""}${m} min` });
  };
  draw(); tick = setInterval(draw, 30000);
}

function wire(has) {
  if (!window.PublicKeyCredential) say(esc(t("approve.no_webauthn")), "err");
  const reg = $("#regf");
  if (reg) reg.onsubmit = (e) => { e.preventDefault(); register($("#name").value.trim(), reg.querySelector("button")); };
  if ($("#nocode")) $("#nocode").onclick = () => rejectWithCode($("#nocode"));
  const cf = $("#codef2");
  if (cf) cf.onsubmit = (e) => { e.preventDefault(); approveWithCode($("#yescode")); };
  else if ($("#yescode")) $("#yescode").onclick = () => approveWithCode($("#yescode"));
  if ($("#regbtn")) $("#regbtn").onclick = () => register($("#name").value.trim(), $("#regbtn"));
  if ($("#yes")) $("#yes").onclick = () => decide("approve", $("#yes"));
  if ($("#no")) $("#no").onclick = () => decide("reject", $("#no"));
}

async function register(name, btn) {
  if (!name) return say(esc(t("approve.name_first")), "err");
  ls.set("vk-approver", name);
  btn.disabled = true;
  try {
    const opts = await api("/approvers/register/options", { method: "POST", body: JSON.stringify({ name, mandate_id: order.mandate_id }) });
    const pk = opts.publicKey;
    const cred = await navigator.credentials.create({ publicKey: {
      ...pk, challenge: b2a(pk.challenge), user: { ...pk.user, id: b2a(pk.user.id) },
      excludeCredentials: (pk.excludeCredentials || []).map((c) => ({ ...c, id: b2a(c.id) })) } });
    await api("/approvers/register/verify", { method: "POST", body: JSON.stringify({ credential: {
      id: cred.id, rawId: a2b(cred.rawId), type: cred.type,
      response: { clientDataJSON: a2b(cred.response.clientDataJSON), attestationObject: a2b(cred.response.attestationObject),
                  transports: cred.response.getTransports ? cred.response.getTransports() : [] } } }) });
    keys = await api(`/orders/${encodeURIComponent(ORDER)}/passkeys`);
    render();
    say(esc(t("approve.setup_done")), "ok");
  } catch (e) {
    btn.disabled = false;
    if (e.status === 401) return askCode("approve.setup_needs_code");
    say(esc(e.name === "NotAllowedError" ? t("approve.setup_cancelled") : e.message), "err");
  }
}

function useCodeField() {
  const f = $("#code");
  if (f && f.value.trim()) ls.set(CODE_KEY, f.value.trim());
}

async function approveWithCode(btn) {
  const by = ($("#name").value || "").trim();
  if (!by) return say(esc(t("approve.name_first_approve")), "err");
  ls.set("vk-approver", by);
  useCodeField();
  btn.disabled = true;
  try {
    order = await api(`/orders/${encodeURIComponent(ORDER)}/approve`, { method: "POST", body: JSON.stringify({ by }) });
    render();  // shows the outcome once ("Approved by … Ordered."); the message adds only which credential decided
    const via = (order.approval || {}).authority;
    if (via) say(`<span class="rule-id">${esc(via)}</span>`, order.status === "ordered" ? "ok" : "err");
  } catch (e) {
    btn.disabled = false;
    say(esc(e.status === 401 ? t("approve.code_not_accepted") : e.message), "err");
  }
}

async function rejectWithCode(btn) {
  const by = ($("#name").value || "").trim();
  useCodeField();
  if (!by) return say(esc(t("approve.name_first_reject")), "err");
  if (!confirm(t("approve.confirm_reject", { id: order.id, amount: eur(order.total_ex_vat) }))) return;
  btn.disabled = true;
  try {
    order = await api(`/orders/${encodeURIComponent(ORDER)}/reject`, { method: "POST", body: JSON.stringify({ by }) });
    render();  // the outcome line ("Rejected by …") is shown once, by render
  } catch (e) {
    btn.disabled = false;
    if (e.status === 401) return askCode("approve.reject_needs_code");
    say(esc(e.message), "err");
  }
}

async function decide(action, btn) {
  if (action === "reject" && !confirm(t("approve.confirm_reject", { id: order.id, amount: eur(order.total_ex_vat) }))) return;
  document.querySelectorAll(".actionbar button").forEach((b) => (b.disabled = true));
  try {
    const opts = await api(`/orders/${encodeURIComponent(ORDER)}/approve/options`, { method: "POST", body: JSON.stringify({ action }) });
    binding = JSON.stringify(opts.binding, null, 2);
    if ($("#binding")) $("#binding").textContent = binding;
    const pk = opts.publicKey;
    const a = await navigator.credentials.get({ publicKey: {
      ...pk, challenge: b2a(pk.challenge), allowCredentials: (pk.allowCredentials || []).map((c) => ({ ...c, id: b2a(c.id) })) } });
    order = await api(`/orders/${encodeURIComponent(ORDER)}/${action}/passkey`, { method: "POST", body: JSON.stringify({ credential: {
      id: a.id, rawId: a2b(a.rawId), type: a.type,
      response: { clientDataJSON: a2b(a.response.clientDataJSON), authenticatorData: a2b(a.response.authenticatorData),
                  signature: a2b(a.response.signature), userHandle: a.response.userHandle ? a2b(a.response.userHandle) : null } } }) });
    render();
    say(`${esc(t("approve.signed_with", { who: (order.approval || {}).authority || t("approve.a_passkey") }))} <a href="${API}/orders/${encodeURIComponent(order.id)}/approval/verify">${esc(t("approve.verify"))}</a>`,
        order.status === "ordered" || order.status === "rejected" ? "ok" : "err");
  } catch (e) {
    document.querySelectorAll(".actionbar button").forEach((b) => (b.disabled = false));
    say(esc(e.name === "NotAllowedError" ? t("approve.prompt_cancelled") : e.message), "err");
  }
}

I18N.onChange(() => { if (view) view(); });
load();
</script>
</body>
</html>
