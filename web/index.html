<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title>Sous gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Fragment+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/inbox">
        <svg class="logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h4l5 11 5-11h4l-7.5 16h-3z" fill="currentColor"/></svg>
        <span class="name">Sous</span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/inbox" data-tab="inbox">Approvals<span id="badge" class="badge" hidden>0</span></a>
        <a href="#/orders" data-tab="orders">Orders</a>
        <a href="#/audit" data-tab="audit">Audit log</a>
        <a href="#/mandates" data-tab="mandates">Mandates</a>
        <a href="#/standing" data-tab="standing">Standing</a>
        <a href="#/stats" data-tab="stats">Stats</a>
      </nav>
      <button id="who" class="who" title="Who is approving">Set your name</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">
    <span>Sous · an open gateway for purchasing agents at Valio Aimo</span>
    <span><a href="/docs">API</a> · <a href="/.well-known/jwks.json">Signing key</a> · <a href="#/audit">Audit log</a> · <button id="qa-toggle" class="linkish" type="button">Show QA test data</button></span>
  </footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-x" data-close aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
