<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title>Try it · Sous</title>
  <meta name="description" content="Try Sous in five minutes: an agent orders from Valio Aimo under a signed mandate. Three orders, three outcomes, one proof.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Fragment+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
    a { color: var(--aimo); text-underline-offset: 2px; }
    .mono { font-family: var(--mono); font-size: .86em; }
    .muted { color: var(--ink-60); }
    .ms { font-family: "Material Symbols Rounded"; font-size: 22px; line-height: 1; display: inline-block; width: 1em; overflow: hidden;
      font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
    .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }
    [hidden] { display: none !important; }

    header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; max-width: 960px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font: 400 1.25rem/1 var(--serif); }
    .sbx { font-size: .78rem; color: var(--ink-60); }
    .sbx b { color: var(--ink); font-weight: 400; }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 12px 0 56px; }

    /* stepper */
    .stepper { display: flex; justify-content: center; gap: 4px; margin: 0 0 34px; padding: 0; list-style: none; }
    .stepper button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: none;
      color: var(--ink-60); font: 500 .82rem/1 var(--sans); cursor: pointer; transition: background .25s, color .25s; }
    .stepper button:disabled { cursor: default; opacity: .55; }
    .stepper i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font: 500 .68rem/1 var(--mono); font-style: normal; transition: background .25s, color .25s, border-color .25s; }
    .stepper .done i { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .stepper .done i::before { content: "\2713"; font-family: var(--sans); font-weight: 700; }
    .stepper .done i span { display: none; }
    .stepper .on button { background: var(--pill); color: var(--ink); }

    /* a stage: one idea, one action */
    .stage { text-align: center; animation: enter .5s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
    .kicker { display: inline-flex; margin-bottom: 14px; }
    h1 { font: 400 clamp(2.1rem, 7vw, 3.1rem)/1.05 var(--serif); letter-spacing: -.02em; margin: 0 0 12px; text-wrap: balance; }
    .line { font-size: 1.06rem; color: var(--ink-80); max-width: 27rem; margin: 0 auto; text-wrap: balance; }
    .line b { font-weight: 600; color: var(--ink); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px;
      border-radius: 999px; border: 1px solid transparent; font: 500 1rem/1 var(--sans); cursor: pointer; text-decoration: none;
      background: var(--pill); color: var(--ink); transition: transform .15s, opacity .15s, background .15s; }
    .btn:hover { background: var(--pill-hover); }
    .btn:active { transform: scale(.97); }
    .btn.solid { background: var(--solid); color: var(--on-solid); }
    .btn.solid:hover { background: var(--solid); opacity: .88; }
    .btn.small { min-height: 34px; padding: 0 14px; font-size: .86rem; }
    .btn:disabled { opacity: .5; cursor: wait; }
    .btn .ms { font-size: 20px; }
    .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; min-height: 48px; }
    .quiet { background: none; border: 0; color: var(--ink-60); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
    .status { font-size: .9rem; color: var(--ink-60); min-height: 1.5em; margin: 12px 0 0; }

    /* the flow: agent -> Sous -> Valio Aimo, with one packet */
    .flow { position: relative; height: 132px; margin: 30px auto 0; max-width: 460px; }
    .flow::before { content: ""; position: absolute; left: 12%; right: 12%; top: 30px; border-top: 1.5px dashed var(--rule); }
    .node { position: absolute; top: 0; width: 24%; margin-left: -12%; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-60); }
    .node b { display: block; color: var(--ink); font-weight: 500; font-size: .84rem; }
    .node .dot { width: 60px; height: 60px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--rule); display: grid; place-items: center; transition: border-color .3s, box-shadow .3s, transform .3s; }
    .n-agent { left: 12%; } .n-sous { left: 50%; } .n-valio { left: 88%; }
    .n-sous .dot { width: 68px; height: 68px; margin-top: -4px; border-color: var(--ink-40); }
    .pkt { position: absolute; top: 30px; left: 12%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--ink); opacity: 0;
      transition: left .9s cubic-bezier(.5, 0, .2, 1), opacity .3s, background .3s; z-index: 2; }
    .flow[data-s="go"] .pkt { opacity: 1; left: 50%; }
    .flow[data-s="go"] .n-sous .dot { animation: think 1s ease-in-out infinite; }
    .flow[data-s="auto"] .pkt { opacity: 0; left: 88%; background: var(--c-auto); transition: left .9s cubic-bezier(.5, 0, .2, 1), opacity .3s .8s, background .3s; }
    .flow[data-s="auto"] .n-valio .dot { color: var(--c-auto); }
    .flow[data-s="auto"] .n-valio .dot { border-color: var(--c-auto); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c-auto) 18%, transparent); }
    .flow[data-s="hold"] .pkt { opacity: 1; left: 50%; background: var(--c-ask); animation: wait 1.4s ease-in-out infinite; }
    .flow[data-s="hold"] .n-sous .dot { border-color: var(--c-ask); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c-ask) 22%, transparent); }
    .flow[data-s="back"] .pkt { opacity: 0; left: 12%; background: var(--c-block); transition: left .7s cubic-bezier(.5, 0, .2, 1), opacity .4s .5s, background .1s; }
    .flow[data-s="back"] .n-sous .dot { border-color: var(--c-block); animation: shake .4s; }
    @keyframes think { 50% { transform: scale(1.07); border-color: var(--ink); } }
    @keyframes wait { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c-ask) 0%, transparent); } 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-ask) 50%, transparent); } }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    :root { --c-auto: #2e6b3c; --c-ask: #e9c400; --c-block: #a8321f; }
    @media (prefers-color-scheme: dark) { :root { --c-auto: #7cc68e; --c-ask: #f2c14e; --c-block: #ef8a76; } }
    .rule-tag { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); white-space: nowrap; font: .74rem var(--mono); color: var(--ink-60);
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); }
    .n-sous span.sub { visibility: hidden; }

    /* the brief's flow, run for real: request -> lookup -> order -> approval */
    .eyebrow { font: .7rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-60); margin: 0 0 14px; }
    .eyebrow b { color: var(--aimo); font-weight: 400; }
    .ask { font: 400 1.15rem/1.35 var(--serif); font-style: italic; color: var(--ink-80); max-width: 27rem; margin: 0 auto; }
    .pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 28px auto 0; padding: 0; list-style: none; max-width: 600px; text-align: left; }
    .pipe li { position: relative; border: 1.5px solid var(--rule); border-radius: var(--radius); padding: 12px; min-height: 104px; opacity: .45;
      transition: opacity .4s, border-color .4s, transform .4s, background .4s; }
    .pipe li.on { opacity: 1; border-color: var(--ink); transform: translateY(-2px); }
    .pipe li.ok { opacity: 1; background: var(--panel); border-color: transparent; }
    .pipe li.on .num { animation: think 1s ease-in-out infinite; }
    .pipe .num { width: 22px; height: 22px; border-radius: 50%; background: var(--aimo); color: var(--paper); display: grid; place-items: center; font: 500 .72rem/1 var(--mono); }
    .pipe li.ok .num::before { content: "\2713"; font-family: var(--sans); font-weight: 700; }
    .pipe li.ok .num span { display: none; }
    .pipe b { display: block; font-weight: 600; font-size: .9rem; margin: 8px 0 2px; }
    .pipe .v { font-size: .8rem; color: var(--ink-60); line-height: 1.35; }
    .pipe li.ok .v { color: var(--ink-80); }
    .pipe li:not(:last-child)::after { content: ""; position: absolute; right: -8px; top: 22px; width: 8px; border-top: 1.5px solid var(--rule); }
    .built { margin: 28px 0 0; padding: 0; list-style: none; text-align: left; }
    .built li { display: grid; grid-template-columns: 28px 1fr; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--rule); animation: enter .5s both; }
    .built li:nth-child(2) { animation-delay: .08s; } .built li:nth-child(3) { animation-delay: .16s; } .built li:nth-child(4) { animation-delay: .24s; }
    .built .num { width: 26px; height: 26px; border-radius: 50%; background: var(--aimo); color: var(--paper); display: grid; place-items: center; font: 700 .8rem/1 var(--sans); }
    .built b { font-weight: 600; }
    .built .v { grid-column: 2; color: var(--ink-60); font-size: .92rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .musts { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 26px 0 0; padding: 0; list-style: none; font-size: .82rem; color: var(--ink-60); }
    .musts li { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--rule); }
    .musts i { width: 18px; height: 18px; border-radius: 50%; background: var(--aimo); color: var(--paper); display: grid; place-items: center; font: 500 .66rem/1 var(--mono); font-style: normal; }

    /* the result of a stage */
    .result { margin: 26px auto 0; max-width: 27rem; animation: enter .45s cubic-bezier(.2, .7, .2, 1) both; }
    .big { font: 400 clamp(2.4rem, 9vw, 3.4rem)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 12px 0 8px; }
    .result p { margin: 0; color: var(--ink-80); }
    .result p b { color: var(--ink); }
    .result.err { background: var(--panel); border-radius: var(--radius); padding: 16px; text-align: left; }
    .notice { display: flex; gap: 14px; align-items: flex-start; text-align: left; max-width: 27rem; margin: 18px auto 0; padding: 14px 16px;
      border-radius: var(--radius); background: var(--notify-bg, #e3edf7); color: var(--ink); animation: enter .45s .25s cubic-bezier(.2, .7, .2, 1) both; }
    .notice .ms { color: var(--notify, #1f5a96); flex: none; margin-top: 2px; }
    .notice b { display: block; font-weight: 600; }
    .notice span { display: block; font-size: .9rem; color: var(--ink-80); margin-top: 2px; }
    .deadline { color: var(--ask-ink); font-weight: 500; font-size: .92rem; margin-top: 6px !important; }
    .tag { display: inline-block; font: 500 .78rem/1 var(--sans); padding: .45em .8em; border-radius: 999px; background: var(--pill); }
    details.more { margin: 18px auto 0; max-width: 27rem; font-size: .88rem; text-align: left; }
    details.more summary { cursor: pointer; color: var(--ink-60); width: fit-content; margin: 0 auto; padding: 6px 10px; border-radius: 999px; list-style: none; }
    details.more summary::-webkit-details-marker { display: none; }
    details.more summary::after { content: " +"; font-family: var(--mono); }
    details.more[open] summary::after { content: " \2212"; }
    details.more .in { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; margin-top: 6px; }
    details.more ul { margin: 0; padding-left: 18px; color: var(--ink-80); }
    details.more dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
    details.more dt { color: var(--ink-60); } details.more dd { margin: 0; overflow-wrap: anywhere; }
    details.more p { margin: 8px 0 0; color: var(--ink-60); }

    /* intro legend: the three outcomes */
    .three { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 22px 0 0; padding: 0; list-style: none; }
    .three li { opacity: .35; transition: opacity .4s, transform .4s; }
    .three li.on { opacity: 1; transform: translateY(-2px); }

    /* the chain in step 4 */
    .chain { display: flex; justify-content: center; align-items: center; gap: 0; margin: 34px auto 0; height: 60px; }
    .chain i { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--rule); transition: background .25s, border-color .25s, transform .25s; }
    .chain u { width: 16px; border-top: 1.5px solid var(--rule); transition: border-color .25s; }
    .chain i.ok { background: var(--c-auto); border-color: var(--c-auto); transform: scale(1.08); }
    .chain u.ok { border-color: var(--c-auto); }

    /* done: recap and what next */
    .recap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 30px 0 0; }
    .recap div { background: var(--panel); border-radius: var(--radius); padding: 14px 8px; animation: enter .5s both; }
    .recap div:nth-child(2) { animation-delay: .08s; } .recap div:nth-child(3) { animation-delay: .16s; } .recap div:nth-child(4) { animation-delay: .24s; }
    .recap b { display: block; font: 400 1.25rem/1.2 var(--serif); margin-top: 8px; font-variant-numeric: tabular-nums; }
    h2 { font: 400 1.5rem/1.2 var(--serif); margin: 44px 0 14px; text-align: center; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: left; }
    .tile { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 0; border-radius: var(--radius); padding: 14px 16px; color: var(--ink);
      text-decoration: none; font: inherit; cursor: pointer; text-align: left; transition: background .15s, transform .15s; }
    .tile:hover { background: var(--panel-strong); transform: translateY(-1px); }
    .tile .ms { color: var(--ink-60); }
    .tile b { font-weight: 500; display: block; }
    .tile span.d { color: var(--ink-60); font-size: .84rem; }
    .tile.wide { grid-column: 1 / -1; background: var(--solid); color: var(--on-solid); }
    .tile.wide:hover { background: var(--solid); opacity: .9; }
    .tile.wide .ms, .tile.wide span.d { color: inherit; opacity: .75; }

    .phone { display: flex; gap: 22px; align-items: center; text-align: left; border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; margin-top: 10px; }
    .qr { flex: none; width: 168px; height: 168px; border-radius: 10px; overflow: hidden; background: #fff; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .phone-t b { display: block; font-weight: 500; }
    .phone-t .d { display: block; color: var(--ink-60); font-size: .9rem; margin: 2px 0 12px; }
    .phone-acts { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
    @media (max-width: 600px) { .phone { flex-direction: column; align-items: flex-start; } .qr { display: none; } }
    .panel { text-align: left; border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; margin-top: 10px; animation: enter .4s both; }
    .panel h3 { font: 500 1rem/1.3 var(--sans); margin: 0 0 14px; }
    .panel ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
    .panel ol > li { counter-increment: n; position: relative; padding-left: 36px; margin-bottom: 16px; }
    .panel ol > li::before { content: counter(n); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--pill); display: grid; place-items: center; font: 500 .76rem var(--mono); }
    .copy { display: flex; gap: 8px; align-items: center; background: var(--panel); border-radius: 8px; padding: 6px 6px 6px 12px; margin-top: 6px; }
    .copy code { flex: 1; font: .8rem var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip { background: var(--pill); border: 0; border-radius: 999px; padding: 8px 14px; font: 500 .84rem var(--sans); color: var(--ink); cursor: pointer; }
    .chip:hover { background: var(--pill-hover); }
    .orders { list-style: none; margin: 0; padding: 0; }
    .orders li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); font-size: .9rem; }
    .orders li:first-child { border-top: 0; }
    .orders .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .orders .eur { font-variant-numeric: tabular-nums; }
    .foot { text-align: center; font-size: .82rem; color: var(--ink-60); margin-top: 28px; }

    @media (max-width: 600px) {
      .stepper span.l { display: none; } .stepper .on span.l { display: inline; }
      .tiles { grid-template-columns: 1fr; } .pipe { grid-template-columns: 1fr 1fr; } .pipe li { min-height: 0; }
      .pipe li:not(:last-child)::after { display: none; }
      main { justify-content: flex-start; padding-top: 20px; }
      .node .dot { width: 52px; height: 52px; } .n-sous .dot { width: 60px; height: 60px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h4l5 11 5-11h4l-7.5 16h-3z" fill="currentColor"/></svg>Sous</a>
    <div class="sbx" id="sbx" hidden></div>
  </div></header>

  <main><div class="wrap">
    <ol class="stepper" id="stepper" hidden aria-label="Steps"></ol>
    <div id="stage" aria-live="polite"></div>
  </div></main>

<script src="qr.js"></script>
<script>
"use strict";
// The judge path, one idea per screen: three orders with three outcomes (auto, needs approval, refused), then the proof.
// One sandbox per browser, shared with agent.html (same localStorage key), the seller and buyer pages (approver code per
// sandbox) and the trust board (agent token for this tab), so no page asks for a token.
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const KEY = "sous-agent-sandbox";
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
             del(k) { try { localStorage.removeItem(k); } catch { /* private mode */ } } };
let state = null;
try { state = JSON.parse(ls.get(KEY) || "null"); } catch { state = null; }
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));

const eur = (n) => "€" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const day = (iso) => new Date(iso.length === 10 ? iso + "T12:00:00" : iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "numeric" }).replace(",", "").replace("/", ".") + ".";
const clock = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const TIER = { silent: ["tier-silent", "Auto"], notify: ["tier-notify", "Auto + FYI"], ask: ["tier-ask", "Needs approval"], block: ["tier-block", "Refused"] };
const tier = (o) => { const [c, l] = TIER[o] || ["", o]; return `<span class="tier ${c}">${esc(l)}</span>`; };
const sentence = (s) => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? "" : ".") : ""; };
const pname = (s) => { s = String(s || ""); return s === s.toUpperCase() ? s[0] + s.slice(1).toLowerCase() : s; };
const ms = (n) => `<span class="ms" aria-hidden="true">${n}</span>`;
const q = () => "?sandbox=" + encodeURIComponent(state.id);
const trace = (id) => `trace.html?order=${encodeURIComponent(id)}&sandbox=${encodeURIComponent(state.id)}`;

function save() {
  ls.set(KEY, JSON.stringify(state));
  ls.set("vk-approver-code:" + state.id, state.approver || "");
  try { sessionStorage.setItem("sous-trace-token", state.token); } catch { /* private mode */ }
}

async function call(path, { method = "GET", body, as = "agent" } = {}) {
  const headers = { "content-type": "application/json" };
  if (state && as === "agent") headers.authorization = "Bearer " + state.token;
  if (state && as === "human") headers["x-approver-code"] = state.approver;
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let d = null;
  try { d = await r.json(); } catch { d = { message: r.statusText }; }
  if (!r.ok) {
    const m = d?.message || d?.detail?.message || (typeof d?.detail === "string" ? d.detail : "") || r.statusText;
    const e = new Error(m); e.status = r.status; throw e;
  }
  return d;
}

// --- small pieces -----------------------------------------------------------------------------------------------------
const flow = (rule) => `<div class="flow" id="flow" data-s="idle" aria-hidden="true">
  <div class="node n-agent"><span class="dot">${ms("smart_toy")}</span><span><b>Agent</b></span></div>
  <div class="node n-sous"><span class="dot">${ms("shield")}</span><span><b>Sous</b></span></div>
  <div class="node n-valio"><span class="dot">${ms("local_shipping")}</span><span><b>Valio Aimo</b></span></div>
  <span class="pkt"></span>${rule ? `<span class="rule-tag">${esc(rule)}</span>` : ""}</div>`;
const setFlow = (s) => { const f = $("#flow"); if (f) f.dataset.s = s; };

function countUp(el, to) {
  if (!el) return;
  if (REDUCED) { el.textContent = eur(to); return; }
  const t0 = performance.now(), dur = 700;
  const tick = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = eur(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

const STEPS = ["Lookup and order", "Human signs off", "Refused", "Proof"];
function stepper() {
  const el = $("#stepper");
  el.hidden = !state || !state.at;
  if (el.hidden) return;
  el.innerHTML = STEPS.map((l, i) => {
    const n = i + 1, done = !!state.done[n], reach = done || n === state.at || !!state.done[n - 1];
    return `<li class="${done ? "done" : ""} ${state.at === n ? "on" : ""}"><button type="button" data-go="${n}" ${reach ? "" : "disabled"} ${state.at === n ? 'aria-current="step"' : ""}>
      <i><span>${n}</span></i><span class="l">${esc(l)}</span></button></li>`;
  }).join("");
}
$("#stepper").addEventListener("click", (ev) => { const b = ev.target.closest("[data-go]"); if (b && !b.disabled) go(+b.dataset.go); });

function go(n) { state.at = n; save(); show(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); }
const next = (n, label) => `<button class="btn solid" type="button" data-next="${n}">${esc(label)} ${ms("arrow_forward")}</button>`;
function mount(html) {
  const st = $("#stage");
  st.innerHTML = `<section class="stage">${html}</section>`;
  st.querySelectorAll("[data-next]").forEach((b) => b.addEventListener("click", () => go(+b.dataset.next)));
  stepper();
  $("#sbx").hidden = !state;
  if (state) $("#sbx").innerHTML = `Sandbox <b class="mono">${esc(state.id)}</b>`;
}

// --- intro ------------------------------------------------------------------------------------------------------------
let loop = null;
function intro() {
  mount(`
    <h1>Try Sous in five minutes.</h1>
    <p class="line">An AI agent orders from Valio Aimo. A mandate signed by a human decides how far it may go.</p>
    ${flow()}
    <ul class="three" id="three"><li data-o="auto">${tier("silent")}</li><li data-o="hold">${tier("ask")}</li><li data-o="back">${tier("block")}</li></ul>
    <div class="acts"><button class="btn solid" id="go" type="button">Start ${ms("arrow_forward")}</button></div>
    <p class="status" id="st" role="status"></p>
    <button class="quiet" id="go-claude" type="button">or connect your own Claude</button>
    <ul class="musts" aria-label="What you will see"><li><i>1</i>Lookup</li><li><i>2</i>Request and order</li><li><i>3</i>Permissions and approval</li></ul>
    <p class="foot">A private sandbox for 24 hours · live Valio Aimo prices · nothing is delivered</p>`);
  // The three outcomes, played in a loop: through, held, bounced.
  const order = ["auto", "hold", "back"]; let i = 0;
  clearInterval(loop);
  const play = async () => {
    if (!$("#three")) return clearInterval(loop);
    const o = order[i++ % 3];
    setFlow("idle"); await sleep(250); setFlow("go"); await sleep(1000);
    if (!$("#three")) return;
    setFlow(o);
    document.querySelectorAll("#three li").forEach((li) => li.classList.toggle("on", li.dataset.o === o));
  };
  play(); loop = setInterval(play, 3200);
  $("#go").addEventListener("click", () => start(1));
  $("#go-claude").addEventListener("click", () => start(5, true));
}

async function start(at, claude) {
  const st = $("#st");
  $("#go").disabled = true;
  st.textContent = "Creating your sandbox…";
  try {
    const s = await call("/sandbox", { method: "POST", as: "none" });
    const m = /-d '(\{.*\})'\s*$/.exec(s.quickstart?.curl_quote || "");
    state = { id: s.sandbox.id, expires_at: s.sandbox.expires_at, token: s.agent_token, approver: s.approver_token,
              mandates: s.mandates, pick: "hotel", quote_body: m ? JSON.parse(m[1]) : null, held: s.seeded?.held_order_id || null,
              why: s.seeded?.reasons || [], prompts: s.prompts || [], done: {}, started: Date.now(), at, claude: !!claude, v: 2 };
    save(); clearInterval(loop); show();
  } catch (e) {
    $("#go").disabled = false;
    st.textContent = e.status === 429 ? `This network has made several sandboxes already. ${sentence(e.message)}` : `That did not work: ${e.message}. Try again in a moment.`;
  }
}

// --- 1: lookup, request and order (the brief's example, through the brief's flow) --------------------------------------
const pipe = () => `<ol class="pipe" id="pipe" aria-label="Request, lookup, order, approval">
  ${[["Request", "What the buyer needs"], ["Lookup", "Products, price, stock"], ["Order", "A fixed price"], ["Approval", "Agent or human"]]
    .map(([t, v], i) => `<li data-p="${i + 1}"><span class="num"><span>${i + 1}</span></span><b>${t}</b><div class="v">${v}</div></li>`).join("")}</ol>`;
function stage(n, text, state = "ok") {
  const li = $(`#pipe [data-p="${n}"]`); if (!li) return;
  li.classList.remove("on", "ok"); li.classList.add(state);
  if (text != null) li.querySelector(".v").innerHTML = text;
}
const LITRES = 1000;

function step1() {
  mount(`
    <p class="eyebrow"><b>Must build 1 + 2</b> · Lookup, request and order</p>
    <h1>The agent buys alone.</h1>
    <p class="ask">“I need 1,000 litres of lactose-free milk by Monday.”</p>
    ${pipe()}
    <div id="out"></div>
    <div class="acts" id="acts"><button class="btn solid" id="run" type="button">Run the hotel's request</button></div>
    <p class="status" id="st" role="status"></p>`);
  const d = state.done[1];
  if (d?.id) Promise.all([call("/orders/" + encodeURIComponent(d.id)), d.quote ? call("/quotes/" + encodeURIComponent(d.quote)).catch(() => null) : null])
    .then(([o, qr]) => { if (state.at === 1) out1(o, qr?.quote, false); }).catch(() => {});
  else if (d?.skipped) again1();
  $("#run")?.addEventListener("click", run1);
}
function again1() {
  $("#acts").innerHTML = `<button class="btn" id="run" type="button">Try again</button>${next(2, "Next")}`;
  $("#run").addEventListener("click", run1); $("#acts [data-next]").addEventListener("click", () => go(2));
}

async function run1() {
  const st = $("#st");
  $("#run").disabled = true; $("#out").innerHTML = "";
  try {
    if (!state.quote_body) throw new Error("this sandbox has no ready-made request");
    const body = { ...state.quote_body, items: state.quote_body.items.map((it) => ({ ...it, amount: LITRES })) };
    stage(1, `${LITRES.toLocaleString("en-GB")} L lactose-free milk, ${esc(day(body.delivery_date))}`);
    stage(2, "Asking Valio Aimo…", "on");
    const [qr] = await Promise.all([call("/quotes", { method: "POST", body }), sleep(1100)]);
    const qt = qr.quote;
    if (!qt?.id) throw new Error(qr.message || "no quote came back");
    lookup(qt);
    stage(3, "Signing the price…", "on"); await sleep(700);
    stage(3, `<b style="display:inline;font-weight:600">${esc(eur(qt.total_ex_vat))}</b> fixed, signed by Sous`);
    stage(4, "Checking the mandate…", "on");
    const [o] = await Promise.all([call("/orders", { method: "POST", body: { agent_id: body.agent_id, mandate_id: body.mandate_id,
      quote_id: qt.id, idempotency_key: `${state.id.toLowerCase()}-${qt.id}` } }), sleep(700)]);
    state.done[1] = { id: o.id, quote: qt.id, total: o.total_ex_vat, outcome: o.decision?.outcome, status: o.status, checked: checked(qt) }; save();
    st.textContent = "";
    out1(o, qt, true);
  } catch (e) {
    st.textContent = "";
    document.querySelectorAll("#pipe li.on").forEach((li) => li.classList.remove("on"));
    state.done[1] ||= { skipped: true }; save();
    $("#out").innerHTML = `<div class="result err"><p><b>The live order did not go through.</b> ${esc(sentence(e.message))}</p>
      <p class="muted" style="margin-top:6px">This step needs Valio Aimo's live price service. The next ones do not.</p></div>`;
    again1(); stepper();
  }
}

const checked = (qt) => (qt.lines || []).length + (qt.alternatives_considered || []).length;
function lookup(qt) {
  const l = (qt.lines || [])[0] || {}, cp = l.comparison_price;
  stage(2, `${checked(qt)} products checked · ${cp ? esc(eur(cp.ex_vat)) + "/" + esc(cp.per) : esc(eur(l.unit_price_ex_vat))}${l.stock || l.orderable ? " · in stock" : ""}`);
}

function out1(o, qt, animate) {
  const d = o.decision || {}, fs = d.findings || [], l = (o.lines || [])[0];
  stage(1, `${LITRES.toLocaleString("en-GB")} L lactose-free milk, ${esc(day(o.requested_delivery_date || o.delivery_date))}`);
  if (qt) lookup(qt); else stage(2, "Live price and stock");
  stage(3, `<b style="display:inline;font-weight:600">${esc(eur(o.total_ex_vat))}</b> fixed, signed by Sous`);
  stage(4, o.status === "ordered" ? "The agent decided alone" : o.status === "pending_approval" ? "A human signs off" : "Refused by the mandate");
  const verdict = o.status === "ordered" ? (d.outcome === "notify" ? "Ordered. The hotel's limit is €2,500, so nobody had to approve; above €1,000 it gets an FYI." : "Ordered. The hotel's limit is €2,500, so nobody had to approve.")
    : o.status === "pending_approval" ? "Held for a human." : "Refused by the mandate.";
  const calls = qt?.valio_api_calls, alts = qt?.alternatives_considered || [];
  $("#out").innerHTML = `<div class="result">${tier(d.outcome)}<div class="big" id="big">${esc(eur(o.total_ex_vat))}</div>
    <p>${esc(verdict)}</p></div>
    <details class="more"><summary>Details</summary><div class="in"><dl>
      <dt>Chosen</dt><dd>${l ? esc(pname(l.name)) + " × " + esc(l.quantity) : ""}</dd>
      ${alts.length ? `<dt>Ruled out</dt><dd>${alts.map((a) => `${esc(pname(a.name))}: ${esc((a.why_not || [])[0] || "not the best fit")}`).join("<br>")}</dd>` : ""}
      ${calls ? `<dt>Valio Aimo</dt><dd>${calls.price_calls + calls.availability_calls} live call${calls.price_calls + calls.availability_calls === 1 ? "" : "s"}, ${calls.cache_hits} from cache. The catalog search is local.</dd>` : ""}
      <dt>Decided by</dt><dd>mandate rules in plain code, no AI</dd>
      <dt>Rules</dt><dd class="mono">${fs.map((f) => esc(f.rule)).join(", ")}</dd>
      <dt>Order</dt><dd><a class="mono" href="${trace(o.id)}" target="_blank" rel="noopener">${esc(o.id)}</a></dd></dl></div></details>`;
  if (animate) countUp($("#big"), o.total_ex_vat);
  $("#acts").innerHTML = next(2, "Next: one that needs a human");
  $("#acts [data-next]").addEventListener("click", () => go(2));
  stepper();
}

// --- 2: the human decides ---------------------------------------------------------------------------------------------
async function step2() {
  mount(`
    <p class="eyebrow"><b>Must build 3</b> · Permissions and approval</p>
    <div class="kicker">${tier("ask")}</div>
    <h1>This one waits for you.</h1>
    <p class="line">The hotel's weekly milk order crept up <b>18%</b>. The mandate stops the agent and asks a human.</p>
    ${flow("mandate: ask when amounts drift")}
    <div id="out"></div>
    <div class="acts" id="acts"></div>
    <p class="status" id="st" role="status"></p>`);
  if (!state.held) { $("#acts").innerHTML = next(3, "Next"); $("#acts [data-next]").addEventListener("click", () => go(3)); return; }
  await sleep(150); setFlow("go"); await sleep(900);
  let o;
  try { o = await call("/orders/" + encodeURIComponent(state.held)); }
  catch (e) { $("#out").innerHTML = `<div class="result err"><p>The waiting order could not be loaded: ${esc(e.message)}</p></div>`; return; }
  if (state.at !== 2) return;
  out2(o, false);
}

function out2(o, animate) {
  const why = (state.why || []).map((w) => sentence(w.replace(/^also:\s*/, "")));
  const details = `<details class="more"><summary>Details</summary><div class="in">
    <ul>${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
    <p>${(o.lines || []).map((l) => `${esc(pname(l.name))} × ${esc(l.quantity)}`).join(" · ")}</p>
    <p>Order <a class="mono" href="${trace(o.id)}" target="_blank" rel="noopener">${esc(o.id)}</a>, priced from reference prices stored in Sous.</p></div></details>`;
  if (o.status === "pending_approval") {
    setFlow("hold");
    $("#out").innerHTML = `<div class="result"><div class="big">${esc(eur(o.total_ex_vat))}</div>
      ${o.approve_by ? `<p class="deadline">Decide by ${esc(day(o.approve_by))} ${esc(clock(o.approve_by))}</p>` : ""}</div>`;
    $("#acts").innerHTML = `<button class="btn solid" type="button" data-decide="approve">Approve ${esc(eur(o.total_ex_vat))}</button>
      <button class="btn" type="button" data-decide="reject">Reject</button>`;
    $("#acts").insertAdjacentHTML("afterend", details);
    $("#acts").querySelectorAll("[data-decide]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.decide)));
    return;
  }
  const ok = o.status === "ordered";
  setFlow(ok ? "auto" : "back");
  document.querySelectorAll("details.more").forEach((d) => d.remove());
  $("#out").innerHTML = `<div class="result"><span class="tag">${ok ? "Approved by you" : o.status === "rejected" ? "Rejected by you" : esc(o.status)}</span>
    <div class="big">${esc(eur(o.total_ex_vat))}</div>
    <p><b>${ok ? "Now Valio Aimo has the order." : "Nothing was ordered."}</b> The agent could not decide this: it never had your approval key.</p></div>`;
  if (!state.done[2]) { state.done[2] = { status: o.status, total: o.total_ex_vat }; save(); }
  $("#acts").innerHTML = next(3, "Next: one that is refused");
  $("#acts [data-next]").addEventListener("click", () => go(3));
  stepper();
}

async function decide(what) {
  const st = $("#st");
  $("#acts").querySelectorAll("button").forEach((b) => { b.disabled = true; });
  st.textContent = what === "approve" ? "Approving…" : "Rejecting…";
  try {
    await call(`/orders/${encodeURIComponent(state.held)}/${what}`, { method: "POST", as: "human", body: { by: "Sandbox judge" } });
    st.textContent = "";
    out2(await call("/orders/" + encodeURIComponent(state.held)), true);
  } catch (e) {
    st.textContent = `That did not go through: ${e.message}`;
    $("#acts").querySelectorAll("button").forEach((b) => { b.disabled = false; });
  }
}

// --- 3: refused -------------------------------------------------------------------------------------------------------
function step3() {
  mount(`
    <p class="eyebrow"><b>Must build 3</b> · Permissions and approval</p>
    <div class="kicker">${tier("block")}</div>
    <h1>This one is refused.</h1>
    <p class="line">The same <b>€1,560</b> of milk, now for a school. Its mandate never allows more than <b>€1,500</b>.</p>
    ${flow("mandate: never above €1,500")}
    <div id="out"></div>
    <div class="acts" id="acts"><button class="btn solid" id="run" type="button">Let the agent try</button></div>
    <p class="status" id="st" role="status"></p>`);
  if (state.done[3]) out3(state.done[3], false);
  $("#run")?.addEventListener("click", run3);
}

async function run3() {
  const st = $("#st");
  $("#run").disabled = true;
  try {
    setFlow("go"); st.textContent = "Checking the order against the mandate…";
    const [d] = await Promise.all([call(`/sandbox/${encodeURIComponent(state.id)}/attacks/over_limit`, { method: "POST" }), sleep(1000)]);
    st.textContent = "";
    const o = (d.orders || [])[d.orders.length - 1] || {};
    state.done[3] = { result: d.result, total: o.total_ex_vat ?? 1560, id: o.id, rule: (d.rules || [])[0]?.id, text: (d.rules || [])[0]?.text, why: d.explanation };
    save(); out3(state.done[3], true);
  } catch (e) { setFlow("idle"); st.textContent = `That did not run: ${e.message}`; $("#run").disabled = false; }
}

function out3(d, animate) {
  const refused = d.result === "refused";
  setFlow(refused ? "back" : d.result === "held for approval" ? "hold" : "auto");
  $("#out").innerHTML = `<div class="result"><div class="big" id="big">${esc(eur(d.total))}</div>
    <p><b>${refused ? "Refused." : esc(sentence(d.result))}</b> ${refused ? "No human can wave it through and the agent cannot argue." : ""}</p></div>
    <div id="notice"></div>
    <details class="more"><summary>Details</summary><div class="in"><dl>
      <dt>Rule</dt><dd><a class="mono" href="/rules/${encodeURIComponent(d.rule || "")}" target="_blank" rel="noopener">${esc(d.rule || "")}</a></dd>
      <dt>It says</dt><dd>${esc(d.text || "")}</dd>
      ${d.id ? `<dt>Order</dt><dd><a class="mono" href="${trace(d.id)}" target="_blank" rel="noopener">${esc(d.id)}</a>, stored as refused</dd>` : ""}</dl></div></details>`;
  if (animate) countUp($("#big"), d.total);
  if (refused && d.id) notice(d.id);
  $("#acts").innerHTML = next(4, "Next: the proof");
  $("#acts [data-next]").addEventListener("click", () => go(4));
  stepper();
}

// A refusal is never silent: the gateway tells the buyer's human at once. Show that message, as it was sent.
async function notice(orderId) {
  let n = null;
  try {
    const d = await call(`/notifications?sandbox=${encodeURIComponent(state.id)}&limit=50`);
    n = (d.notifications || []).find((x) => x.order_id === orderId && x.audience === "buyer");
  } catch { /* fall back to the plain sentence */ }
  const el = $("#notice"); if (!el) return;
  const text = n?.message ? String(n.message).split(" Order: ")[0] : "Your agent's order was refused and nothing was ordered.";
  el.innerHTML = `<div class="notice">${ms("notifications_active")}<div><b>The school's buyer was told at once</b><span>“${esc(text)}”</span></div></div>`;
}

// --- 4: the proof -----------------------------------------------------------------------------------------------------
function step4() {
  mount(`
    <p class="eyebrow"><b>Trust</b> · A record of what the agent did and why</p>
    <h1>And nobody can rewrite it.</h1>
    <p class="line">The buyer and Valio Aimo read the <b>same log</b>. Each entry is chained to the one before, so neither side can change the story later.</p>
    <div class="chain" id="chain" aria-hidden="true">${Array.from({ length: 7 }, (_, i) => (i ? "<u></u>" : "") + "<i></i>").join("")}</div>
    <div id="out"></div>
    <div class="acts" id="acts"><button class="btn solid" id="run" type="button">Verify the log</button></div>
    <p class="status" id="st" role="status"></p>`);
  $("#run").addEventListener("click", run4);
}

async function run4() {
  const st = $("#st");
  $("#run").disabled = true; st.textContent = "Checking every entry against the one before it…";
  try {
    const p = call("/audit/verify", { as: "none" });
    const parts = [...document.querySelectorAll("#chain i, #chain u")];
    for (const el of parts) { el.classList.add("ok"); await sleep(90); }
    const v = await p;
    let mine = 0;
    try { mine = ((await call(`/audit?sandbox=${encodeURIComponent(state.id)}&limit=100`)).events || []).length; } catch { /* a nicety */ }
    st.textContent = "";
    if (!v.ok) { parts.forEach((el) => el.classList.remove("ok")); $("#out").innerHTML = `<div class="result err"><p><b>The chain does not verify.</b></p></div>`; $("#run").disabled = false; return; }
    $("#out").innerHTML = `<div class="result"><div class="big">Intact</div>
      <p><b>${Number(v.events).toLocaleString("en-GB")} entries, none changed or removed.</b>${mine ? ` ${mine} are yours.` : ""}</p></div>
      <details class="more"><summary>Details</summary><div class="in"><dl><dt>Chain head</dt><dd class="mono">${esc(v.head || "")}</dd>
        <dt>Check it yourself</dt><dd><a href="/audit/verify" target="_blank" rel="noopener">/audit/verify</a> · <a href="/.well-known/jwks.json" target="_blank" rel="noopener">signing key</a> · <a href="./${q()}#/audit" target="_blank" rel="noopener">your entries</a></dd></dl></div></details>`;
    state.done[4] = { events: v.events }; state.finished ||= Date.now(); save();
    $("#acts").innerHTML = next(5, "Finish");
    $("#acts [data-next]").addEventListener("click", () => go(5));
    stepper();
  } catch (e) { st.textContent = `The check did not run: ${e.message}`; $("#run").disabled = false; }
}

// --- 5: done, and what next -------------------------------------------------------------------------------------------
let timer = null;
function done() {
  const d = state.done, all = [1, 2, 3, 4].every((i) => d[i] && !d[i].skipped);
  const mins = state.finished && state.started ? Math.max(1, Math.round((state.finished - state.started) / 60000)) : null;
  mount(`
    ${all ? `<h1>That is Sous.</h1>
      <p class="line">The brief's three must-builds, run for real${mins ? ` in about ${mins} min` : ""}.</p>

          <span class="v">The same rules also check allergens, quantity deviations, price changes and delivery issues on every order.</span></li>
        <li><span class="num">\u2713</span><b>Trust on both sides</b><span class="v">One log of ${Number(d[4].events).toLocaleString("en-GB")} entries, intact, read by buyer and Valio Aimo alike</span></li>
      </ol>`
    : `<h1>Your sandbox is ready.</h1><p class="line">Explore freely, or take the four-step tour first.</p>
       <div class="acts"><button class="btn solid" type="button" data-next="${[1, 2, 3, 4].find((i) => !d[i]) || 1}">Take the tour ${ms("arrow_forward")}</button></div>`}
    <h2>${all ? "Keep going" : "Explore"}</h2>
    <div class="tiles">
      <button class="tile wide" type="button" id="t-claude">${ms("forum")}<span><b>Use your own Claude</b><span class="d">Let your assistant do the buying, under the same mandates.</span></span></button>
      <div class="panel" id="claude" style="grid-column:1/-1" ${state.claude ? "" : "hidden"}>
        <ol>
          <li>In claude.ai: <b>Settings → Connectors → Add custom connector</b>
            <div class="copy"><code id="c-url">${esc(location.origin)}/connect/mcp</code><button class="btn small" data-copy="url" type="button">Copy URL</button></div></li>
          <li>Press <b>Connect</b> and paste the agent token
            <div class="copy"><code>${esc(state.token.slice(0, 12))}…</code><button class="btn small" data-copy="token" type="button">Copy token</button></div></li>
          <li>Ask it to buy something. Tap to copy a request:
            <div class="chips">${(state.prompts || []).map((p, i) => `<button class="chip" type="button" data-copy="prompt" data-i="${i}" title="${esc(p.prompt)}">${esc(p.title)}</button>`).join("")}</div></li>
        </ol>
        <p class="muted" style="font-size:.84rem;margin:0">The approval key stays in this browser. Claude Code and others:
          <button class="quiet" style="padding:0;font-size:inherit" data-copy="cc" type="button">copy the command</button> · <a href="https://github.com/Zawaer/sous/blob/main/docs/CONNECT.md" target="_blank" rel="noopener">guide</a></p>
      </div>
      <a class="tile" href="break.html${q()}">${ms("bug_report")}<span><b>Try to break it</b><span class="d">Six attacks</span></span></a>
      <a class="tile" href="./${q()}#/today">${ms("storefront")}<span><b>Valio Aimo's view</b><span class="d">Orders and audit log</span></span></a>
      <a class="tile" href="${trace(d[1]?.id || state.held || "")}">${ms("verified_user")}<span><b>The trust board</b><span class="d">One order, proven</span></span></a>
    </div>
    <div class="phone">
      <div class="qr" id="qr"></div>
      <div class="phone-t"><b>The buyer's inbox, on your phone</b>
        <span class="d">Scan the code. Then send an order that needs a human, and approve it from the phone.</span>
        <div class="phone-acts"><button class="btn small solid" id="send-held" type="button">Send an order that needs approval</button>
          <a class="quiet" href="buyer.html${q()}#/inbox">or open the inbox here</a></div>
        <p class="status" id="held-st" role="status" style="text-align:left;margin:6px 0 0"></p></div>
    </div>
    <div class="panel" id="orders-panel" hidden><h3>Your sandbox's orders</h3><ul class="orders" id="orders"></ul></div>
    <p class="foot"><span id="left"></span> <button class="quiet" id="reset" type="button">Start over</button></p>`);
  // The phone needs this sandbox's approver token: it travels in the link's fragment, which is not sent to the server.
  const phoneUrl = `${location.origin}/ui/buyer.html${q()}#/inbox?k=${encodeURIComponent(state.approver || "")}`;
  const code = typeof QR !== "undefined" && state.approver ? QR.svg(phoneUrl, { border: 3 }) : "";
  if (code) $("#qr").innerHTML = code; else $("#qr").hidden = true;
  $("#send-held").addEventListener("click", sendHeld);
  $("#t-claude").addEventListener("click", () => { const p = $("#claude"); p.hidden = !p.hidden; state.claude = !p.hidden; save(); });
  $("#reset").addEventListener("click", () => {
    if (!confirm("Leave this sandbox and start with a new one? This browser forgets its tokens.")) return;
    ls.del(KEY); state = null; clearInterval(timer); timer = null; show();
  });
  loadOrders();
  clearInterval(timer); timer = setInterval(() => { if (!document.hidden && state?.at === 5) loadOrders(); }, 5000);
}

// A real order just over the hotel's limit (2,000 L of milk, live price): the mandate holds it for a human.
async function sendHeld() {
  const b = $("#send-held"), st = $("#held-st");
  b.disabled = true; st.textContent = "The agent asks for 2,000 litres of milk, more than it may buy alone…";
  try {
    const body = { ...state.quote_body, items: state.quote_body.items.map((it) => ({ ...it, amount: 2000 })) };
    const qr = await call("/quotes", { method: "POST", body });
    if (!qr.quote?.id) throw new Error(qr.message || "no quote came back");
    const o = await call("/orders", { method: "POST", body: { agent_id: body.agent_id, mandate_id: body.mandate_id, quote_id: qr.quote.id,
      idempotency_key: `${state.id.toLowerCase()}-${qr.quote.id}` } });
    st.textContent = o.status === "pending_approval" ? `${eur(o.total_ex_vat)} is waiting for a human. It is in the inbox now.`
      : o.status === "ordered" ? `${eur(o.total_ex_vat)} was inside the limit and went through. Try again in a moment.`
      : `The mandate refused it: ${sentence((o.decision?.findings || [])[0]?.message || "")}`;
    loadOrders();
  } catch (e) { st.textContent = `That did not go through: ${e.message}`; }
  finally { b.disabled = false; }
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { prompt("Copy this:", text); return; }
  const was = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = was; }, 1400);
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-copy]"); if (!b || !state) return;
  const k = b.dataset.copy;
  copy(k === "url" ? location.origin + "/connect/mcp" : k === "token" ? state.token : k === "prompt" ? state.prompts[+b.dataset.i].prompt
    : `claude mcp add --transport http sous ${location.origin}/mcp --header "Authorization: Bearer ${state.token}"`, b);
});

async function loadOrders() {
  if (!state || !$("#orders")) return;
  try {
    const d = await call(`/orders?sandbox=${encodeURIComponent(state.id)}`);
    const os = (d.orders || []).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 8);
    if (!$("#orders")) return;
    $("#orders-panel").hidden = !os.length;
    $("#orders").innerHTML = os.map((o) => {
      const out = o.status === "pending_approval" ? "ask" : o.status === "ordered" ? (o.decision?.outcome === "notify" ? "notify" : "silent") : "block";
      const href = o.status === "pending_approval" ? `buyer.html${q()}#/orders/${encodeURIComponent(o.id)}` : trace(o.id);
      return `<li>${o.approval && o.status === "ordered" ? '<span class="tag">Approved</span>' : tier(out)}<a class="what" href="${href}">${esc(pname((o.lines || [])[0]?.name || o.id))}${o.status === "pending_approval" ? " · decide" : o.status === "rejected" ? " · rejected" : ""}</a><span class="eur">${esc(eur(o.total_ex_vat))}</span></li>`;
    }).join("");
    const s = await call("/sandbox/" + encodeURIComponent(state.id), { as: "none" });
    if ($("#left")) $("#left").textContent = `${s.quotes_left} of ${s.quotes_limit} live lookups left ·`;
  } catch { /* the list is a nicety */ }
}

// --- router -----------------------------------------------------------------------------------------------------------
function show() {
  if (!state) return intro();
  state.done ||= {};
  if (state.v !== 2) {  // a sandbox made by the first version of this page: its step 3 was the proof
    state.done = { ...(state.done[1] ? { 1: state.done[1] } : {}), ...(state.done[2] ? { 2: state.done[2] } : {}) };
    state.v = 2; state.at = 0;
  }
  if (!state.at) state.at = [1, 2, 3, 4].find((i) => !state.done[i]) || 5;
  ({ 1: step1, 2: step2, 3: step3, 4: step4, 5: done })[state.at]();
}

(async () => {
  if (state) {
    try { const s = await call("/sandbox/" + encodeURIComponent(state.id), { as: "none" }); if (s.status !== "active") throw new Error(s.status); save(); }
    catch (e) { if (e.status !== undefined || /expired|deleted/.test(e.message)) { ls.del(KEY); state = null; } }
  }
  show();
})();
</script>
</body>
