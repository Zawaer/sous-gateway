    expect:
      outcome_in: [ask, block]
      options_kinds: [split_with_substitute]
      options_first_kind: split_with_substitute
      options_cover_need: true
      no_allergen: [AM, AN, AP]
      second: {outcome: ask, status: pending_approval, rules: [substitution]}

