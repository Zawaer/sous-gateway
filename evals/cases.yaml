  # --- Response options: when an item can't be covered as asked, the quote lists complete alternatives
  # (sous/options.py), each with lines, totals, delivery dates, a plain-language trade-off and the mandate
  # tier it would get. The agent picks one with request_quote(option_id=...) and orders the new quote.
  # The Valio mock reports every product's earliest date as Monday 16.11, so 'partial now, rest later'
  # can't occur live; it is covered offline in tests/test_options.py.

  - id: O01
    title: Stock short across two candidates -> options; the agent takes the split with a substitute
    request: "100 kg of Paulig Brazil or Café Napoli coffee beans; fill the gap with something similar if you must."
    mandate: M-HOTEL-AURORA
    agent: aurora-purchasing-agent
    candidates: [461851, 473843]
    amount: 100
    unit: KG
    flow: [choose_option]
    choose: {kind: split_with_substitute}
    expect:
      outcome: ask
      rules: [need.partial]
      options_kinds: [split_with_substitute, substitute]
      options_first_kind: split_with_substitute
      options_cover_need: true
      options_preview: {split_with_substitute: ask}
      second: {outcome: ask, status: pending_approval, rules: [substitution]}

  - id: O02
    title: One product short -> split with a substitute, which the hospital's mandate sends to a human
    request: "200 litres of Oatly No Sugars oat drink for Monday."
