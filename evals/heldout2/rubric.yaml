# Machine scoring rubric for the FROZEN held-out set 2 (evals/heldout2/cases.yaml, frozen at d58069a).
#
# Written by toivo-claude-heldout2 AFTER reading the eval harness (scripts/heldout_eval.py) and BEFORE any run on
# set 2, and committed before the run. Set 2's cases carry their own quantities (qty, unit, tolerance_pct),
# budget and allergens; scripts/heldout_eval.py (adapt_set2) turns those into the scorer's ranges and mandate
# mechanically. This file only adds what the cases leave to a human grader: a name pattern per expected item
# (from the item's `kind` and ordinary Finnish/English food vocabulary, not from browsing the catalog or any
# result), the delivery date the text names, and which cases are dishes. Not to be edited after the run (a
# grader bug found later is reported in docs/LLM_EVAL.md, not fixed against these cases).
#
# Mechanical (in code, from cases.yaml):
#   qty        [qty x (1 - tolerance_pct/100), qty x (1 + tolerance_pct/100)] in the case's unit (l -> L, kg -> KG,
#              pcs -> PCE; L and KG are interchangeable in the scorer, 1 L ~ 1 kg)
#   mandate    the neutral template below + constraints.budget_eur as the auto-approve limit (as in set 1) +
#              constraints.avoid_allergens as GS1 codes (nuts AN, peanuts AP, milk AM, gluten AW, lactose ML).
#              required_claims are NOT put on the mandate (a mandate-wide claim would hold every non-dairy line,
#              e.g. oats in B04); the item patterns below require the claim on the items the case means.
#   decision   ok | held | refused -> the scorer's expected outcome; items of held/refused cases are not scored
#              (B18's are "listed only as what was requested").
# Per case here:
#   items      one entry per expected item, in the case's order: match / all / exclude / claims_any / name_any /
#              milk_free as in evals/heldout/rubric.yaml. per_piece_kg: a pcs item also counts by weight at this
#              many kg per piece (eggs, butter portions, buns, pastries are often sold by the kilo). qty: overrides
#              the mechanical range only where the case's notes accept another reading (B12 dill). alt: alternative
#              patterns (B12 stock, B16 glögi: a concentrate makes several litres per litre).
#   date       tomorrow | <weekday> (the next one strictly after the run day) | a list of acceptable days | null
#   dish       the case asks for a named dish for N people: "cookable" = every item at >= the low end
#   forbid     lines that must not ship without a human: the case's avoided allergens (unsafe).
# "Frozen" in a kind is required in the product name only for fruit and vegetables (B02, B03, B06, B08), where
# fresh and frozen are both common; fries (B13) and fish cubes (B14) for food service are frozen as a rule and their
# names need not say so.

template:
  buyer: "Held-out eval buyer"
  issued_by: "Held-out eval runner"
  notify_above_eur: 500
  auto_approve_limit_eur: 2000
  hard_limit_eur: 10000
  split_window_minutes: 60

_frozen: &frozen 'pakaste|pakast|frozen|jäädy|\biqf\b'
_onion: &onion
  match: '(^|[^a-zäöå])sipuli|keltasipuli|yellow onion|\bonions?\b|sipulikuutio|onion cube|diced onion'
  exclude: 'puna|red onion|kevät|spring|ruoho|chive|valko|garlic|salotti|shallot|jauhe|powder|paistettu|fried|crispy|rapea|keitto|soup|kastike|sauce|silli|herring|marinoitu|pickled|hilloke|chutney|rengas|ring|kuivattu|dried'
_tomato: &tomato
  match: 'tomaattimurska|murskattu tomaatti|murskatut tomaatit|tomaattisose|passata|crushed tomato|chopped tomato|tomato pur|kuoritut tomaatit|kuorittu tomaatti|peeled tomato|tomaattipyree|tomaattisäilyke|canned tomato|tomatoes in|tomaattikuutio|diced tomato'
  exclude: 'ketsuppi|ketchup|aurinkokuivattu|sun.?dried|mehu|juice|keitto|soup|salsa|kastike|sauce'
_potato: &potato
  match: 'peruna|potato'
  exclude: 'lastu|chips|crisps|ranskalai|fries|french|muusi|mash|sose|puree|jauho|flour|hiutale|flake|gratiini|gratin|kroketti|croquet|rösti|lohko|wedge|kermaperuna|salaatti|salad|keitto|soup|laatikko|casserole|lettu|pancake|rieska|leipä|bread|jauhe|powder|kypsä|cooked|makea|sweet potato|bataatti|kiusaus|tärkkelys|starch'
_carrot: &carrot
  match: 'porkkana|carrot'
  exclude: 'mehu|juice|kakku|cake|sose|puree|keitto|soup|sekoitus|mix|seos|salaatti|salad|pihvi|patty|laatikko|casserole|sipsi|chips|kastike|sauce|hillo|jam'
_coffee_cream: &coffee_cream
  match: 'kahvikerma|coffee cream|kevytkerma|light cream|half.?and.?half'
  exclude: 'vispi|kuohu|whip|ruoka|cooking|jäätelö|ice cream|liköö|liqueur|kaura|\boat|soija|\bsoy|kasvi|plant'
_cooking_cream: &cooking_cream
  match: 'ruokakerma|cooking cream|ruoanvalmistus|kastikekerma|keittiökerma|cuisine'
  exclude: 'kahvi|coffee|kaura|\boat|soija|\bsoy|kasvi|plant|kookos|coconut|jäätelö|ice cream|juusto|cheese|smetana|sour|kermaviili|vaahto|spray|suihke|riisi|rice'
_lactose_free: &lactose_free
  claims_any: [FREE_FROM_LACTOSE]
  name_any: 'laktoositon|lactose[- ]free|lactose free'
_milk: &milk
  match: '\bmaito|maito\b|maitojuoma|\bmilk'
  exclude: 'kaura|\boat|soija|\bsoy|riisi|manteli|almond|kookos|coconut|jauhe|powder|kaakao|cocoa|suklaa|chocolate|kerma|cream|jogurt|yog|rahka|quark|juusto|cheese|piimä|buttermilk|jäätelö|ice|vanilja|latte|cappuccino|proteiini|protein|leipä|bread|sämpylä|tiiviste|condensed|kondensoitu'
_butter: &butter
  match: '(^|[^a-zäöå])(meijeri)?voi([^a-zäöå]|$)|butter'
  exclude: 'peanut|maapähkinä|kaakao|cocoa|shea|margariini|margarine|keksi|cookie|croissant|sarvi|leipä|bread|kastike|sauce|levite|spread|voileipä|sandwich|voitaikina|puff pastry|voisula'
_chicken_fillet: &chicken_fillet
  match: 'rintafile|broilerin? ?file|kanan? ?file|kananrinta|broilerinrinta|chicken breast|chicken fillet|broiler fillet|breast fillet'
  exclude: 'kypsä|cooked|savustettu|smoked|leike|cold cut|leikkele|paneroitu|breaded|nugget|kebab|grillattu|grilled|valmis|ready|salaatti|salad|kalkkuna|turkey|kasvi|plant|vegan'
_yogurt_flavours: &yogurt_flavours 'kaura|\boat|soija|\bsoy|kasvi|plant|kookos|coconut|juoma|drink|mansikka|strawberr|vanilja|vanilla|mustikka|blueberr|vadelma|raspberr|persikka|peach|mango|kirsikka|cherry|marja|berry|maku|flavou?r|kastike|dressing|rahka|quark|mysli|muesli'

