        match: 'jauheliha|minced|\bmince|ground beef'
        exclude: 'kana|chicken|broiler|kalkkuna|turkey|kasvi|plant|soija|\bsoy|nyhtö|pulled|vegan|härkis|pyörykkä|meatball|pihvi'
        qty: {KG: [3.5, 6.5]}
      - name: tomatoes
        match: 'tomaattimurska|murskattu tomaatti|murskatut tomaatit|tomaattisose|passata|crushed tomato|chopped tomato|tomato pur|tomaattikastike|tomato sauce|kuoritut tomaatit|kuorittu tomaatti|peeled tomato|tomaattipyree|tomaattipiltti|tomaattisäilyke|canned tomato|tomatoes in'
        exclude: 'ketsuppi|ketchup|aurinkokuivattu|sun.?dried|mehu|juice|keitto|soup|salsa'
        qty: {KG: [3.5, 9]}
      - name: bechamel liquid (milk or ready white sauce)
        alt:
          - {<<: *milk, qty: {L: [2.5, 6]}}
          - {match: 'bechamel|béchamel|besamel|valkokastike|white sauce|lasagnekastike|lasagne sauce|lasagnette sauce', qty: {L: [2, 8]}}
      - name: bechamel fat/flour (butter, margarine, flour or ready white sauce)
