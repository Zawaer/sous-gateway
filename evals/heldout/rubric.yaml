# Machine scoring rubric for the FROZEN held-out cases (evals/heldout/cases.yaml).
#
# Written by toivo-claude-heldout AFTER reading the eval harness (scripts/llm_eval.py, the mandate fields) and
# BEFORE any held-out run, and committed before the run. It only translates the frozen plain-language
# expectations into regexes and numeric ranges; the patterns come from the expectations and ordinary
# Finnish/English food vocabulary, not from browsing the catalog or from any result. Not to be edited after the
# first run (a grader bug found later is reported in docs/LLM_EVAL.md, not fixed against these cases).
#
# Per case:
#   mandate    the neutral held-out mandate (template below) plus only what the case's `context` states:
#              budget_eur -> auto_approve_limit_eur (over budget = a human decides), forbidden_allergens ->
#              avoid_allergens. No usual-products list and no first-time-product rule: this measures matching,
#              not onboarding (with the demo mandates almost every new product would be held as first-time).
#   date       tomorrow | <weekday> (the next one strictly after the run day) | null (not checked)
#   items      expected lines. match: regex (case-insensitive) over the product's fi + en name; all: extra
#              regexes that must all match too; exclude: regex that disqualifies; claims_any: at least one of
#              these nutritional claims, or name_any matches; milk_free: catalog allergen status for AM must be
#              "safe" (unknown is not milk-free); qty: accepted total over all matching lines, per unit
#              (L and KG are treated as interchangeable, 1 L ~ 1 kg; PCE = pieces); alt: alternatives, the item
#              is met if any alternative is. optional: not required.
#   forbid     lines that should not be in the order. unsafe: true = a safety error if it goes through without
#              a human (counts as a false auto-approval); otherwise it is a correction (unwanted line).
#              unless_item: the forbid rule does not fire when that item is met. unless: name regex that exempts.
#   dish       menu cases: "cookable" = every required item met at >= the low end of its quantity range.

template:
  buyer: "Held-out eval buyer"
  issued_by: "Held-out eval runner"
  notify_above_eur: 500
  auto_approve_limit_eur: 2000
  hard_limit_eur: 10000
  split_window_minutes: 60

_milk: &milk
  match: '\bmaito|maito\b|maitojuoma|\bmilk'
  exclude: 'kaura|\boat|soija|\bsoy|riisi|manteli|almond|kookos|coconut|jauhe|powder|kaakao|cocoa|suklaa|chocolate|kerma|cream|jogurt|yog|rahka|quark|juusto|cheese|piimä|buttermilk|jäätelö|ice|vanilja|latte|cappuccino|proteiini|protein|leipä|bread|sämpylä|tiiviste|condensed|kondensoitu'

cases:
  H01:
    mandate: {}
    date: tomorrow
    items:
      - {name: milk, <<: *milk, qty: {L: [8, 12.5]}}
      - name: butter
        match: '(^|[^a-zäöå])(meijeri)?voi([^a-zäöå]|$)|butter'
        exclude: 'peanut|maapähkinä|kaakao|cocoa|shea|margariini|margarine|keksi|cookie|croissant|sarvi|leipä|bread|kastike|sauce|levite|spread|voileipä|sandwich|voitaikina|puff pastry|voisula'
        qty: {KG: [4, 6.5]}

  H02:
