        qty: {KG: [12, 22]}
      - name: cream or cooking cream for the sauce
        match: 'kerma|cream|ruoanvalmistus|cooking base|kaurapohja|cuisine'
        exclude: 'jäätelö|ice cream|smetana|sour cream|kermaviili|tuorejuusto|cream cheese|creme fraiche|crème fraîche|kermajuusto|vaahto|spray|suihke|kahvi|coffee|perunat|potato|kakku|cake|kastikepohja?jauhe|powder'
