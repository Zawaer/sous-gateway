          - {match: 'vehnäjauho|wheat flour|jauho|flour|maizena|maissitärkkelys|corn ?starch|suurus', exclude: 'riisi|rice|ruis|rye|kaura|\boat|mantelijauho|almond|kookos|leipä|bread', qty: {KG: [0.2, 2]}}
          - {match: 'bechamel|béchamel|besamel|valkokastike|white sauce|lasagnekastike|lasagne sauce', qty: {L: [2, 8]}}
      - name: grated cheese
