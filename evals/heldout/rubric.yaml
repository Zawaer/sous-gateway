        qty: {L: [5, 7.5]}
    forbid:
      - {name: cooking cream instead of whipping cream, match: 'ruokakerma|cooking cream|ruoanvalmistus|kaurapohja|oat cooking|kaura.*ruoka'}

  H03:
    mandate: {}
    date: friday
    dish: lasagne
    items:
